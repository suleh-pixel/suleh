<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SULEH</title><style>body{background:#0a0e13;color:#fff;text-align:center;font-family:monospace;margin:0;padding:12px}h1{color:#7ef9a0;font-size:44px;margin:8px 0;letter-spacing:8px}canvas{background:#0e1822;border:2px solid #1c3a2e;border-radius:16px;width:95%;max-width:400px;display:block;margin:10px auto}button{padding:12px 18px;margin:4px;border-radius:10px;border:1px solid #2a4a3a;background:#162a1f;color:#aef9c2}</style></head><body><h1>SULEH</h1><p>Classic Snake - by Hacker Suleh</p><p>Score:<span id="sc">0</span> Best:<span id="bc">0</span></p><canvas id="cv" width="400" height="400"></canvas><div><button onclick="go(0,-1)">UP</button><br><button onclick="go(-1,0)">LEFT</button><button onclick="go(0,1)">DOWN</button><button onclick="go(1,0)">RIGHT</button></div><br><button onclick="init()" style="background:#7ef9a0;color:#000;font-weight:800">Restart</button><p style="opacity:.5;font-size:11px;margin-top:12px">Hacking is a God given gift - Mombasa 2026</p><script>let cv=document.getElementById('cv');let ctx=cv.getContext('2d');let snake,dir,ndir,food,score,best,loop,playing;best=parseInt(localStorage.getItem('best')||'0');document.getElementById('bc').innerText=best;function init(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};ndir={x:1,y:0};score=0;document.getElementById('sc').innerText=0;makeFood();playing=false;clearInterval(loop);draw();}function makeFood(){while(true){let f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};if(!snake.some(s=>s.x==f.x&&s.y==f.y)){food=f;break;}}}function draw(){ctx.fillStyle='#0e1822';ctx.fillRect(0,0,400,400);ctx.fillStyle='#ffde59';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);snake.forEach((s,i)=>{ctx.fillStyle=i==0?'#7ef9a0':'#2fb86a';ctx.fillRect(s.x*20+1,s.y*20+1,18,18)});if(!playing){ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,400,400);ctx.fillStyle='#7ef9a0';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('TAP TO PLAY',200,200);}}function tick(){dir=ndir;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0)h.x=19;if(h.x>19)h.x=0;if(h.y<0)h.y=19;if(h.y>19)h.y=0;if(snake.some(s=>s.x==h.x&&s.y==h.y)){playing=false;clearInterval(loop);draw();return;}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score+=10;document.getElementById('sc').innerText=score;if(score>best){best=score;document.getElementById('bc').innerText=best;localStorage.setItem('best',best);}makeFood();}else{snake.pop();}draw();}function go(x,y){if(dir.x==-x&&dir.y==-y)return;ndir={x,y};if(!playing){playing=true;loop=setInterval(tick,110);}}cv.addEventListener('click',()=>{if(!playing){playing=true;loop=setInterval(tick,110);}});init();</script></body></html>
